# yaml-language-server: $schema=../../../schema/turboci.schema.json

deployments:
    - deployment_name: mariadb_galera_maxscale
      provider: hetzner
      location: ash
      description: >
          MariaDB Galera multi-primary cluster (3 nodes) fronted by MaxScale.
          MaxScale uses galeramon to monitor cluster health and readwritesplit
          to route writes to the primary while distributing reads across all nodes.

          MaxScale supports MariaDB (all versions), MariaDB Galera, and MySQL 5.5+.
          It does NOT support PostgreSQL — use HAProxy for that.
      services:
          db:
              type: mariadb-galera
              # Keep the instances at 1 for as close to
              # zero downtime as possible.
              instances: 1
              # Clusters should be the only changing variable
              # for horizontal scaling. Minimum for mariadb
              # galera is 3. And it *MUST be an odd number.
              clusters: 3
              mariadb_galera:
                  root_password: "${DB_ROOT_PASSWORD}"
                  databases:
                      - name: myapp
                        password: "${DB_APP_PASSWORD}"
                        charset: utf8mb4
                        collation: utf8mb4_unicode_ci
                  users:
                      - user: archben
                        password: "${DB_APP_PASSWORD}"
                        hosts:
                            - "${DEV_MACHINE_IP}"
                        databases:
                            - db_name: myapp
                  data_dir: /mnt/data/mariadb
              volumes:
                  - mount_dir: /mnt/data
                    size: 10
              run:
                  start:
                      cmds:
                          - /usr/local/bin/tci-galera-start.sh

              healthcheck:
                  cmd: mariadb -u root -p"${DB_ROOT_PASSWORD}" -e "SHOW STATUS LIKE 'wsrep_ready'"
                  test: "ON"
              logs:
                  - journalctl -fu mariadb

          maxscale:
              type: maxscale
              maxscale:
                  target_services:
                      - service_name: db
                        port: 3306
                  listen_port: 3306
                  admin_user: admin
                  admin_password: "${MAXSCALE_ADMIN_PASSWORD}"
                  user: maxscale_monitor
                  password: "${MAXSCALE_MONITOR_PASSWORD}"
              healthcheck:
                  cmd: maxctrl list servers
                  test: "Master"
              logs:
                  - journalctl -fu maxscale
                  - tail -n 20 /var/log/maxscale/maxscale.log
